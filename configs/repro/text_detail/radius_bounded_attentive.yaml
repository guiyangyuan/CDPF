# Image-conditioned detail bounded by the frozen per-class description radius.
DATALOADER:
  NUM_WORKERS: 0
  TEST:
    BATCH_SIZE: 16
    SAMPLER: SequentialSampler
  TRAIN_X:
    BATCH_SIZE: 16
DATASET:
  NUM_SHOTS: 16
  SUBSAMPLE_CLASSES: base
INPUT:
  INTERPOLATION: bicubic
  PIXEL_MEAN:
  - 0.48145466
  - 0.4578275
  - 0.40821073
  PIXEL_STD:
  - 0.26862954
  - 0.26130258
  - 0.27577711
  SIZE: (224, 224)
  TRANSFORMS:
  - random_resized_crop
  - random_flip
  - normalize
MODEL:
  BACKBONE:
    NAME: ViT-B/16
OPTIM:
  LR: 0.002
  LR_SCHEDULER: cosine
  MAX_EPOCH: 20
  MOMENTUM: 0.9
  NAME: sgd
  WARMUP_CONS_LR: 1.0e-05
  WARMUP_EPOCH: 1
  WARMUP_TYPE: constant
  WEIGHT_DECAY: 0.0005
TEST:
  FINAL_MODEL: last_step
  SPLIT: val
TRAIN:
  PRINT_FREQ: 10
TRAINER:
  NAME: CoOp_TextDetail_RadiusBounded
  TEXTCONSISTENCY:
    ABLATION_GROUP: full
    ADAPTIVE_CE_WEIGHT: 0.0
    AGGREGATION: mean
    CONTRASTIVE_WEIGHT: 0.0
    DEVICE: cpu
    DIVERSITY_WEIGHT: 0.0
    ENSEMBLE_ALPHA: 0.5
    INFERENCE_BRANCH: corrected
    KD_LOSS_MODE: full_kl
    KD_TEMP: 2.0
    KD_WEIGHT: 0.0
    N_CTX: 4
    N_GROUPS: 4
    N_VIEWS: 20
    ORDER_SEED: 0
    PREC: fp32
    TEXT_BATCH_SIZE: 32
    USE_FEATURE_ADAPTER: false
    USE_VISUAL_ADAPTER: false
    VIEW_ORDER: contiguous
    VISUAL_ADAPTER_DIM: 64
    VISUAL_ADAPTER_SCALE: 0.2
    CORRECTION_TEXT: description
    TEXT_RESIDUAL_MODE: classname
    TEXT_RESIDUAL_DIM: 64
    TEXT_RESIDUAL_SCALE: 0.2
    TEXT_RESIDUAL_K: 5
    TEXT_RESIDUAL_ADAMW_LR: 0.001
    TEXT_DETAIL_POOLING: attentive
USE_CUDA: false
