DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 16
  TEST:
    BATCH_SIZE: 16
  NUM_WORKERS: 4
INPUT:
  SIZE: (224, 224)
  INTERPOLATION: bicubic
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: [random_resized_crop, random_flip, normalize]
OPTIM:
  NAME: sgd
  LR: 0.002
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0005
  MAX_EPOCH: 20
  LR_SCHEDULER: cosine
  WARMUP_EPOCH: 1
  WARMUP_TYPE: constant
  WARMUP_CONS_LR: 0.00001
MODEL:
  BACKBONE:
    NAME: ViT-B/16
TEST:
  FINAL_MODEL: last_step
TRAIN:
  PRINT_FREQ: 10
TRAINER:
  TEXTCONSISTENCY:
    PREC: fp32
    N_CTX: 4
    N_VIEWS: 20
    N_GROUPS: 4
    KD_WEIGHT: 0.0
    KD_TEMP: 2.0
    ADAPTIVE_CE_WEIGHT: 1.0
    CONTRASTIVE_WEIGHT: 0.0
    DIVERSITY_WEIGHT: 0.0
    ENSEMBLE_ALPHA: 0.5
    TEXT_BATCH_SIZE: 32
