# B: CoOp plus shared visual adapter; no description CE.
USE_CUDA: false
DATASET:
  NUM_SHOTS: 16
  SUBSAMPLE_CLASSES: base
DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 16
  TEST:
    BATCH_SIZE: 16
    SAMPLER: SequentialSampler
  NUM_WORKERS: 0
INPUT:
  SIZE: (224, 224)
  INTERPOLATION: bicubic
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: [random_resized_crop, random_flip, normalize]
OPTIM:
  NAME: sgd
  LR: 0.002
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0005
  MAX_EPOCH: 20
  LR_SCHEDULER: cosine
  WARMUP_EPOCH: 1
  WARMUP_TYPE: constant
  WARMUP_CONS_LR: 0.00001
MODEL:
  BACKBONE:
    NAME: ViT-B/16
TEST:
  SPLIT: val
  FINAL_MODEL: last_step
TRAIN:
  PRINT_FREQ: 10
TRAINER:
  NAME: CoOp_TextConsistency_V2_FG
  TEXTCONSISTENCY:
    PREC: fp32
    N_CTX: 4
    N_VIEWS: 20
    N_GROUPS: 4
    AGGREGATION: mean
    VIEW_ORDER: contiguous
    ORDER_SEED: 0
    USE_FEATURE_ADAPTER: false
    USE_VISUAL_ADAPTER: true
    VISUAL_ADAPTER_DIM: 64
    VISUAL_ADAPTER_SCALE: 0.2
    ABLATION_GROUP: full
    KD_WEIGHT: 0.0
    KD_TEMP: 2.0
    KD_LOSS_MODE: full_kl
    ADAPTIVE_CE_WEIGHT: 0.0
    CONTRASTIVE_WEIGHT: 0.0
    DIVERSITY_WEIGHT: 0.0
    ENSEMBLE_ALPHA: 0.5
    INFERENCE_BRANCH: ensemble
    DEVICE: cpu
    TEXT_BATCH_SIZE: 32
